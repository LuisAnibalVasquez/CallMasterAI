<div class="login-container">
  <section class="login-card">
    <div class="card-header">
      <h1>Nueva Contraseña</h1>
      <p>Defina su nueva contraseña de acceso</p>
    </div>
    <div class="card-content">
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        <div class="form-field full-width">
          <label>Nueva Contraseña</label>
          <div class="password-field">
            <input [type]="hidePassword() ? 'password' : 'text'" formControlName="newPassword">
            <button type="button" (click)="hidePassword.set(!hidePassword())">{{ hidePassword() ? 'Mostrar' : 'Ocultar' }}</button>
          </div>
          <small *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">La contraseña es requerida (min 8 caracteres)</small>
        </div>

        <div class="form-field full-width">
          <label>Confirmar Contraseña</label>
          <input [type]="hidePassword() ? 'password' : 'text'" formControlName="confirmPassword">
          @if (resetForm.hasError('notSame')) {
            <small class="error">Las contraseñas no coinciden</small>
          }
        </div>

        <div class="actions">
          <button type="submit" [disabled]="resetForm.invalid || isLoading()" class="full-width">
            {{ isLoading() ? 'Guardando...' : 'Restablecer Contraseña' }}
          </button>
        </div>
      </form>
    </div>
    <footer class="links">
      <a routerLink="/auth/login">Volver al Inicio de Sesión</a>
    </footer>
  </section>
</div>
