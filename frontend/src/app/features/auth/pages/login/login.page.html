<div class="login-container">
  <section class="login-card">
    <div class="card-header">
      <h1>CallMaster AI</h1>
      <p>Inicie sesión para continuar</p>
    </div>
    <div class="card-content">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-field full-width">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="ej: admin@callmaster.ai">
          <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">Ingrese un email válido</small>
        </div>

        <div class="form-field full-width">
          <label>Contraseña</label>
          <div class="password-field">
            <input [type]="hidePassword() ? 'password' : 'text'" formControlName="password">
            <button type="button" (click)="hidePassword.set(!hidePassword())">{{ hidePassword() ? 'Mostrar' : 'Ocultar' }}</button>
          </div>
          <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">La contraseña es requerida (min 8 caracteres)</small>
        </div>

        <div class="actions">
          <button type="submit" [disabled]="loginForm.invalid || isLoading()" class="full-width">
            {{ isLoading() ? 'Iniciando...' : 'Iniciar Sesión' }}
          </button>
        </div>
      </form>
    </div>
    <footer class="links">
      <a routerLink="/auth/forgot-password">¿Olvidó su contraseña?</a>
    </footer>
  </section>
</div>
