<div class="container">
  <section class="card">
    <div class="card-header">
      <h1>Actualizar Contraseña</h1>
      <p>Su contraseña debe tener al menos 8 caracteres</p>
    </div>
    <div class="card-content">
      <form [formGroup]="changeForm" (ngSubmit)="onSubmit()">
        <div class="form-field full-width">
          <label>Contraseña Actual</label>
          <div class="password-field">
            <input [type]="hidePasswords() ? 'password' : 'text'" formControlName="currentPassword">
            <button type="button" (click)="hidePasswords.set(!hidePasswords())">{{ hidePasswords() ? 'Mostrar' : 'Ocultar' }}</button>
          </div>
        </div>

        <div class="form-field full-width">
          <label>Nueva Contraseña</label>
          <input [type]="hidePasswords() ? 'password' : 'text'" formControlName="newPassword">
        </div>

        <div class="form-field full-width">
          <label>Confirmar Nueva Contraseña</label>
          <input [type]="hidePasswords() ? 'password' : 'text'" formControlName="confirmPassword">
          @if (changeForm.hasError('notSame')) {
            <small class="error">Las contraseñas no coinciden</small>
          }
        </div>

        <div class="actions">
          <button type="submit" [disabled]="changeForm.invalid || isLoading()">
            {{ isLoading() ? 'Actualizando...' : 'Cambiar Contraseña' }}
          </button>
        </div>
      </form>
    </div>
  </section>
</div>
