<div class="force-container">
  <section class="force-card">
    <div class="card-header">
      <h1>Cambio de Contraseña Obligatorio</h1>
      <p>Por seguridad, debe actualizar su contraseña antes de continuar</p>
    </div>
    <div class="card-content">
      <form [formGroup]="forceForm" (ngSubmit)="onSubmit()">
        <div class="form-field full-width">
          <label>Contraseña Actual</label>
          <div class="password-field">
            <input [type]="hidePasswords() ? 'password' : 'text'" formControlName="currentPassword">
            <button type="button" (click)="hidePasswords.set(!hidePasswords())">{{ hidePasswords() ? 'Mostrar' : 'Ocultar' }}</button>
          </div>
        </div>

        <div class="form-field full-width">
          <label>Nueva Contraseña</label>
          <input [type]="hidePasswords() ? 'password' : 'text'" formControlName="newPassword">
        </div>

        <div class="form-field full-width">
          <label>Confirmar Nueva Contraseña</label>
          <input [type]="hidePasswords() ? 'password' : 'text'" formControlName="confirmPassword">
          @if (forceForm.hasError('notSame')) {
            <small class="error">Las contraseñas no coinciden</small>
          }
        </div>

        <div class="actions">
          <button type="submit" [disabled]="forceForm.invalid || isLoading()" class="full-width">
            {{ isLoading() ? 'Actualizando...' : 'Actualizar y Re-iniciar Sesión' }}
          </button>
        </div>
      </form>
    </div>
  </section>
</div>
